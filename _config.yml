# GitHub Pages Jekyll config
plugins: []
markdown: kramdown
# Jekyll nokta ile başlayan klasörleri atlar; Quest uygulaması (sanal fabrika TWA) doğrulaması için şart
include:
  - .well-known
exclude:
  - .gitignore
  - .git
  - node_modules
  - "*.sh"
  - tools
  - README.md
  
# Disable caching
keep_files: []

# Build settings
future: true
